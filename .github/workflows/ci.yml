name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpcs --runtime-set ignore_warnings_on_exit 1 -q
      - run: vendor/bin/phpunit --display-deprecations
      - name: Smoke test the executable
        run: |
          php bin/naluz --version
          php bin/naluz list
